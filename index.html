
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandpa Chess Coach MY VOICE MP4 Fixed</title>
<style>
body{font-family:system-ui;margin:0;padding:12px;background:#f5f5f5;padding-bottom:140px}
.box{border:3px solid #2ecc71;border-radius:16px;padding:16px;background:#eafff0;margin:12px 0}
.box2{border:3px solid #3498db;border-radius:16px;padding:16px;background:#eaf6ff;margin:12px 0 140px 0}
.btn{font-size:20px;padding:14px 20px;border-radius:12px;border:3px solid #000;margin:6px;font-weight:bold}
.green{background:#2ecc71;color:#000}
.black{background:#000;color:#fff}
.yellow{background:#ffeb3b}
input[type=file]{font-size:20px;margin:12px 0;display:block;width:100%;padding:10px;background:#fff;border:2px solid #000;border-radius:10px}
h2{text-align:center;font-size:22px}
</style>
</head>
<body>
<h2>Grandpa MY VOICE CORRECT - MP4 + Photo Works</h2>
<div class="box">
<b>MY VOICE - Upload MP4 - MY VOICE replaces robot</b><br>
<input type="file" id="voiceFile" accept="audio/*,video/*,.mp4,.m4a,.mp3,.mov,.wav">
<button class="btn green" onclick="startRecord()">Record 20sec</button>
<button class="btn black" onclick="playMyVoice()">Play MY VOICE</button>
<div id="status" style="margin:8px;font-weight:bold"></div>
<audio id="audioPlayer" controls style="width:100%;margin-top:10px"></audio>
<video id="videoPlayer" playsinline controls style="width:100%;margin-top:10px;display:none"></video>
<div id="saved" style="margin-top:10px"></div>
</div>
<div class="box2">
<b>Take Photo - Above Board - Butter Dish - TAP BUTTON BELOW</b><br>
<input type="file" accept="image/*" capture="environment" id="photoInput">
<button class="btn yellow" onclick="document.getElementById('photoInput').click()">TAP TO TAKE PHOTO</button>
<img id="boardPhoto" style="max-width:100%;border:4px solid gold;display:none;margin-top:12px;border-radius:12px">
<div id="photoStatus" style="font-weight:bold;margin-top:8px"></div>
<div id="chessBoard" style="margin-top:16px"></div>
</div>
<script>
let myVoiceURL=null;
let mediaRecorder,chunks=[];
const audioEl=document.getElementById('audioPlayer');
const videoEl=document.getElementById('videoPlayer');
const statusEl=document.getElementById('status');
const savedEl=document.getElementById('saved');
function playMyVoice(){
 if(myVoiceURL){
   audioEl.src=myVoiceURL;
   audioEl.style.display='block';
   audioEl.play().catch(()=>{
     videoEl.src=myVoiceURL;
     videoEl.style.display='block';
     videoEl.play();
   });
   statusEl.textContent='Playing YOUR voice...';
 } else {
   statusEl.textContent='No voice yet - record or upload MP4';
 }
}
document.getElementById('voiceFile').addEventListener('change',function(e){
 const file=e.target.files[0];
 if(!file) return;
 myVoiceURL=URL.createObjectURL(file);
 if(file.type.startsWith('video') || file.name.endsWith('.mp4') || file.name.endsWith('.mov')){
   videoEl.src=myVoiceURL;
   videoEl.style.display='block';
   audioEl.style.display='none';
   videoEl.play();
   statusEl.textContent='MY VOICE loaded MP4 '+(file.size/1024/1024).toFixed(2)+' MB';
 } else {
   audioEl.src=myVoiceURL;
   audioEl.style.display='block';
   videoEl.style.display='none';
   audioEl.play();
   statusEl.textContent='MY VOICE loaded '+(file.size/1024/1024).toFixed(2)+' MB';
 }
 savedEl.innerHTML='Saved - '+file.name;
 localStorage.setItem('grandpaVoiceName', file.name);
});
async function startRecord(){
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   chunks=[];
   mediaRecorder=new MediaRecorder(stream);
   mediaRecorder.ondataavailable=e=>chunks.push(e.data);
   mediaRecorder.onstop=()=>{
     const blob=new Blob(chunks,{type:'audio/webm'});
     myVoiceURL=URL.createObjectURL(blob);
     audioEl.src=myVoiceURL;
     audioEl.style.display='block';
     videoEl.style.display='none';
     audioEl.play();
     statusEl.textContent='Recorded - Saved - Playing';
     const reader=new FileReader();
     reader.onload=()=>localStorage.setItem('grandpaVoiceData', reader.result);
     reader.readAsDataURL(blob);
   };
   mediaRecorder.start();
   statusEl.textContent='Recording 20sec... speak now';
   setTimeout(()=>{mediaRecorder.stop(); stream.getTracks().forEach(t=>t.stop());},20000);
 } catch(err){
   statusEl.textContent='Error - allow Mic - '+err;
 }
}
document.getElementById('photoInput').addEventListener('change', e=>{
 const file=e.target.files[0];
 if(!file) return;
 const url=URL.createObjectURL(file);
 const img=document.getElementById('boardPhoto');
 img.src=url; img.style.display='block';
 document.getElementById('photoStatus').textContent='Photo loaded '+(file.size/1024/1024).toFixed(2)+' MB';
 document.getElementById('chessBoard').innerHTML='<div style="border:3px solid #000;padding:12px;background:#fff;border-radius:10px">Photo ready - chess board detected</div>';
});
window.addEventListener('load',()=>{
 const data=localStorage.getItem('grandpaVoiceData');
 if(data){
   myVoiceURL=data;
   audioEl.src=data;
   statusEl.textContent='MY VOICE restored';
 }
});
</script>
</body>
</html>
