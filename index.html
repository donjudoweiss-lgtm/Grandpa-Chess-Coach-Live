
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grandpa Chess Coach</title><style>body{font-family:system-ui;padding:18px;background:#f6f5ef}.c{background:#fff;border-radius:12px;padding:14px;margin:10px 0;border:1px solid #ddd}.g{background:#e8f5e9}.b{padding:12px 16px;border-radius:10px;border:0;background:#222;color:#fff;margin:5px}</style></head><body><h1>Grandpa MY VOICE CORRECT Blue Fixed</h1><div class="c g"><h2>🎙️ MY VOICE replaces robot</h2><button class="b" style="background:#4caf50" onclick="rec()">● Record 20sec</button><button class="b" onclick="v.play()">▶️ Play</button><div id="s">No voice</div><audio id="v" controls style="width:100%;display:none"></audio></div><div class="c"><h2>📸 Photo Above Board</h2><button class="b" style="background:#4caf50" onclick="cam()">📸 Camera</button><button class="b" id="t" style="display:none" onclick="sh()">Take</button><video id="vi" autoplay playsinline style="width:100%;max-width:400px;display:none;background:#000"></video><canvas id="ca" style="display:none"></canvas><img id="im" style="width:100%;max-width:400px;display:none"></div><script>let m,d=[];const v=document.getElementById('v'),s=document.getElementById('s');let x=localStorage.getItem('gv');if(x){v.src=x;v.style.display='block';s.textContent='Loaded'}function rec(){navigator.mediaDevices.getUserMedia({audio:true}).then(a=>{d=[];m=new MediaRecorder(a);m.ondataavailable=e=>d.push(e.data);m.onstop=()=>{let b=new Blob(d,{type:'audio/webm'});let r=new FileReader();r.onload=()=>{localStorage.setItem('gv',r.result);v.src=r.result;v.style.display='block';s.textContent='Saved'};r.readAsDataURL(b)};m.start();s.textContent='Recording';setTimeout(()=>{m.stop();a.getTracks().forEach(t=>t.stop())},20000)})}const vi=document.getElementById('vi'),ca=document.getElementById('ca'),im=document.getElementById('im');function cam(){navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{vi.srcObject=s;vi.style.display='block';document.getElementById('t').style.display='inline-block'})}function sh(){ca.width=vi.videoWidth;ca.height=vi.videoHeight;ca.getContext('2d').drawImage(vi,0,0);im.src=ca.toDataURL();im.style.display='block';vi.srcObject.getTracks().forEach(t=>t.stop());vi.style.display='none'}</script></body></html>
