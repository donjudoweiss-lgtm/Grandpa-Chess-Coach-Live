<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandpa Chess Coach - Development - Photo Above Board + MY VOICE</title>
<style>
body{font-family:system-ui;margin:10px;background:#f7f7f7}
.box{border:3px solid #2ecc71;background:#e8f8f0;padding:12px;border-radius:12px;margin:10px 0}
.btn{font-size:20px;padding:12px 18px;border-radius:10px;border:2px solid #000;margin:6px}
.green{background:#2ecc71;color:#000}
.black{background:#000;color:#fff}
.white{background:#fff;color:#000}
.yellow{background:#ffeb3b}
</style>
</head>
<body>
<h2>Grandpa MY VOICE CORRECT - MP4 Works</h2>
<div class="box">
<b>📖 MY VOICE - Upload Voice Memo File - MY VOICE replaces robot</b><br>
<input type="file" id="voiceFile" accept="audio/*,video/*,.mp4,.m4a,.mp3,.mov" style="font-size:18px;margin:10px 0"><br>
<button class="btn green" onclick="startRecord()">🔴 Record 20sec</button>
<button class="btn black" onclick="playMyVoice()">▶️ Play MY VOICE</button>
<div id="status" style="margin:8px;font-weight:bold"></div>
<audio id="audioPlayer" controls style="width:100%;margin-top:10px"></audio>
<video id="videoPlayer" playsinline controls style="width:100%;margin-top:10px;display:none"></video>
<div id="saved" style="margin-top:10px"></div>
</div>
<div class="box" style="border-color:#3498db">
<b>📸 Take Photo - Above Board - Butter Dish</b><br>
<input type="file" accept="image/*" capture="environment" id="photoInput" style="font-size:18px;margin:10px 0">
<img id="boardPhoto" style="max-width:100%;border:3px solid gold;display:none">
</div>
<div id="coach">Chess coach content here - upload MY VOICE above to replace robot voice</div>
<script>
let mediaRecorder, chunks=[];
let myVoiceURL=null;
const audioEl=document.getElementById('audioPlayer');
const videoEl=document.getElementById('videoPlayer');
const statusEl=document.getElementById('status');
const savedEl=document.getElementById('saved');

function playMyVoice(){
 if(myVoiceURL){
   audioEl.src=myVoiceURL;
   audioEl.play().catch(()=>{
     videoEl.src=myVoiceURL;
     videoEl.style.display='block';
     videoEl.play();
   });
   statusEl.textContent='Playing YOUR voice...';
 } else {
   statusEl.textContent='No voice yet - record or upload MP4';
 }
}

document.getElementById('voiceFile').addEventListener('change',function(e){
 const file=e.target.files[0];
 if(!file) return;
 myVoiceURL=URL.createObjectURL(file);
 if(file.type.startsWith('video') || file.name.endsWith('.mp4') || file.name.endsWith('.mov')){
   videoEl.src=myVoiceURL;
   videoEl.style.display='block';
   audioEl.style.display='none';
   videoEl.play();
   statusEl.textContent='✅ MY VOICE loaded MP4 '+ (file.size/1024/1024).toFixed(2)+' MB - Will play everywhere';
 } else {
   audioEl.src=myVoiceURL;
   audioEl.style.display='block';
   videoEl.style.display='none';
   audioEl.play();
   statusEl.textContent='✅ MY VOICE loaded '+(file.size/1024/1024).toFixed(2)+' MB';
 }
 savedEl.innerHTML='<audio controls src="'+myVoiceURL+'"></audio><br>Saved - '+file.name;
 localStorage.setItem('grandpaVoiceName', file.name);
});

async function startRecord(){
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   chunks=[];
   mediaRecorder=new MediaRecorder(stream);
   mediaRecorder.ondataavailable=e=>chunks.push(e.data);
   mediaRecorder.onstop=()=>{
     const blob=new Blob(chunks,{type:'audio/webm'});
     myVoiceURL=URL.createObjectURL(blob);
     audioEl.src=myVoiceURL;
     audioEl.style.display='block';
     videoEl.style.display='none';
     audioEl.play();
     statusEl.textContent='✅ Recorded 20sec - Saved - Playing';
     savedEl.innerHTML='<audio controls src="'+myVoiceURL+'"></audio><br>Saved - Recorded voice';
     // save as base64 for persistence
     const reader=new FileReader();
     reader.onload=()=>localStorage.setItem('grandpaVoiceData', reader.result);
     reader.readAsDataURL(blob);
   };
   mediaRecorder.start();
   statusEl.textContent='🔴 Recording 20sec... speak now';
   setTimeout(()=>{mediaRecorder.stop(); stream.getTracks().forEach(t=>t.stop());},20000);
 } catch(err){
   statusEl.textContent='Error - mic permission needed - please Allow Microphone - '+err;
 }
}

document.getElementById('photoInput').addEventListener('change', e=>{
 const file=e.target.files[0];
 if(!file) return;
 const url=URL.createObjectURL(file);
 const img=document.getElementById('boardPhoto');
 img.src=url; img.style.display='block';
});

// restore saved
window.addEventListener('load',()=>{
 const name=localStorage.getItem('grandpaVoiceName');
 if(name) savedEl.textContent='Last saved: '+name;
 const data=localStorage.getItem('grandpaVoiceData');
 if(data){
   myVoiceURL=data;
   audioEl.src=data;
   statusEl.textContent='✅ MY VOICE restored from saved';
 }
});
</script>
</body>
</html>
