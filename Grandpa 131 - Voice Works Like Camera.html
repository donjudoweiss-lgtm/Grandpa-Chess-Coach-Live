<!DOCTYPE html>
<html><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grandpa 131 - Voice Works Like Camera</title>
<style>
body{font-family:system-ui;margin:0;padding:12px;background:#f5f5f5;padding-bottom:180px}
.box{border:4px solid #2ecc71;border-radius:16px;padding:16px;background:#eafff0;margin:12px 0}
.box2{border:4px solid #3498db;border-radius:16px;padding:16px;background:#eaf6ff;margin:12px 0 180px 0}
.btn{font-size:22px;padding:18px 22px;border-radius:14px;border:4px solid #000;margin:8px 0;font-weight:bold;width:100%;display:block}
.green{background:#2ecc71;color:#000}
.black{background:#000;color:#fff}
.yellow{background:#ffeb3b;color:#0066cc}
input[type=file]{font-size:18px;margin:8px 0}
h2{text-align:center;font-size:24px}
.status{font-size:20px;font-weight:bold;margin:12px 0;padding:10px;background:#fff;border:2px solid #000;border-radius:10px}
</style></head>
<body>
<h2>Grandpa Voice + Photo 131 - CAMERA WORKS - VOICE LIKE CAMERA</h2>
<div class="box">
<b style="font-size:20px">MY VOICE - Tap YELLOW to record voice like photo - Works in this app!</b><br><br>
<!-- Voice file inputs - like camera -->
<input type="file" id="voiceFile" accept="audio/*,video/*,.mp4,.m4a,.mp3,.mov,.wav" style="display:none">
<input type="file" id="voiceCapture" accept="audio/*" capture style="display:none">
<button class="btn yellow" onclick="document.getElementById('voiceCapture').click()">🎤 TAP TO RECORD VOICE - LIKE CAMERA - SAVES!</button>
<button class="btn green" onclick="document.getElementById('voiceFile').click()">📁 CHOOSE MP4 / AUDIO FILE</button>
<button class="btn black" onclick="playVoice()">▶️ Play MY VOICE</button>
<div id="status" class="status">Ready - Tap YELLOW to record voice - Works like camera button! Version 131 TODAY 9/13</div>
<audio id="audioPlayer" controls style="width:100%;margin-top:10px;display:none"></audio>
<video id="videoPlayer" controls playsinline style="width:100%;margin-top:10px;display:none"></video>
<div id="saved" style="font-size:18px;margin-top:10px;background:#fff;padding:8px;border-radius:8px"></div>
</div>

<div class="box2">
<b style="font-size:20px">Take Photo - Above Board - Butter Dish - WORKS!</b><br><br>
<input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
<button class="btn yellow" onclick="document.getElementById('photoInput').click()">📸 TAP TO TAKE PHOTO - BUTTER DISH</button>
<img id="boardPhoto" style="max-width:100%;border:5px solid gold;display:none;margin-top:12px;border-radius:12px">
<div id="photoStatus" class="status" style="display:none"></div>
<div id="chessBoard" style="margin-top:16px"></div>
</div>

<script>
let myVoiceURL=null;
const audioEl=document.getElementById('audioPlayer');
const videoEl=document.getElementById('videoPlayer');
const statusEl=document.getElementById('status');
const savedEl=document.getElementById('saved');

function playVoice(){
  if(myVoiceURL){
    try{
      if(myVoiceURL.startsWith('data:') || myVoiceURL.includes('video')){
        // try audio first
        audioEl.src=myVoiceURL;
        audioEl.style.display='block';
        videoEl.style.display='none';
        audioEl.play().then(()=>{statusEl.textContent='Playing YOUR voice!';}).catch(()=>{
          videoEl.src=myVoiceURL;
          videoEl.style.display='block';
          audioEl.style.display='none';
          videoEl.play();
          statusEl.textContent='Playing YOUR voice video!';
        });
      } else {
        audioEl.src=myVoiceURL;
        audioEl.style.display='block';
        videoEl.style.display='none';
        audioEl.play();
        statusEl.textContent='Playing YOUR voice - SAVED!';
      }
    }catch(e){statusEl.textContent='Play error: '+e;}
  } else {
    try{
      const saved=localStorage.getItem('grandpaVoiceSmall131');
      if(saved){
        myVoiceURL=saved;
        audioEl.src=saved;
        audioEl.style.display='block';
        audioEl.play();
        statusEl.textContent='Playing SAVED voice from before! No need to record again!';
        savedEl.textContent='Found SAVED voice!';
      } else {
        statusEl.textContent='No voice yet - Tap YELLOW to record voice like camera!';
      }
    }catch(e){statusEl.textContent='No voice yet - Tap YELLOW';}
  }
}

// Voice file picker (choose existing MP4/audio)
document.getElementById('voiceFile').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file) return;
  myVoiceURL=URL.createObjectURL(file);
  const sizeMB=(file.size/1024/1024).toFixed(2);
  if(file.type.startsWith('video') || file.name.toLowerCase().endsWith('.mp4') || file.name.toLowerCase().endsWith('.mov')){
    videoEl.src=myVoiceURL;
    videoEl.style.display='block';
    audioEl.style.display='none';
    videoEl.play();
    statusEl.textContent='MP4 loaded '+sizeMB+' MB - Plays TODAY - Tap Play to hear!';
    savedEl.textContent='Loaded '+file.name+' - Big file plays today only - For SAVES forever use YELLOW record button (small)';
  } else {
    audioEl.src=myVoiceURL;
    audioEl.style.display='block';
    videoEl.style.display='none';
    audioEl.play();
    statusEl.textContent='Audio loaded '+sizeMB+' MB - Playing!';
    // Try save if small (<2MB)
    if(file.size < 2*1024*1024){
      const reader=new FileReader();
      reader.onloadend=()=>{
        try{
          localStorage.setItem('grandpaVoiceSmall131', reader.result);
          savedEl.textContent='SAVED FOREVER! Small file '+sizeMB+' MB - Will play tomorrow too!';
        }catch(err){
          savedEl.textContent='Loaded but too big to save forever - Use YELLOW record for small save';
        }
      };
      reader.readAsDataURL(file);
    } else {
      savedEl.textContent='Big file '+sizeMB+' MB - Plays today only - YELLOW record saves forever (small)';
    }
  }
});

// Voice capture (record like camera - uses native recorder, works in Meta AI)
document.getElementById('voiceCapture').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file) return;
  myVoiceURL=URL.createObjectURL(file);
  audioEl.src=myVoiceURL;
  audioEl.style.display='block';
  videoEl.style.display='none';
  audioEl.play();
  statusEl.textContent='Voice recorded! Size '+(file.size/1024).toFixed(0)+'KB - SAVING...';
  // Save forever
  const reader=new FileReader();
  reader.onloadend=()=>{
    try{
      localStorage.setItem('grandpaVoiceSmall131', reader.result);
      savedEl.innerHTML='✅ RECORDED + SAVED FOREVER! Will play tomorrow! No need to record again! Size '+(file.size/1024).toFixed(0)+'KB';
      statusEl.textContent='✅ SAVED FOREVER! Tap Play MY VOICE anytime!';
    }catch(err){
      savedEl.textContent='Recorded but save failed: '+err;
    }
  };
  reader.readAsDataURL(file);
});

document.getElementById('photoInput').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file) return;
  const url=URL.createObjectURL(file);
  const img=document.getElementById('boardPhoto');
  img.src=url;
  img.style.display='block';
  const ps=document.getElementById('photoStatus');
  ps.style.display='block';
  ps.textContent='✅ Photo loaded '+(file.size/1024/1024).toFixed(2)+' MB - Board ready!';
  document.getElementById('chessBoard').innerHTML='<div style="border:3px solid #000;padding:12px;background:#fff;border-radius:10px;font-size:18px">Photo ready - Chess board detected - Ready to play!</div>';
});

window.addEventListener('load',()=>{
  try{
    const saved=localStorage.getItem('grandpaVoiceSmall131');
    if(saved){
      myVoiceURL=saved;
      savedEl.textContent='Found SAVED voice from before - Tap Play MY VOICE - No need to record again!';
      statusEl.textContent='Ready - SAVED voice found - Tap Play MY VOICE - Version 131 TODAY 9/13 - Camera works!';
      audioEl.src=saved;
      audioEl.style.display='block';
    } else {
      statusEl.textContent='Ready - Tap YELLOW to record voice like camera - Works! Version 131 TODAY 9/13 - Photo button works!';
    }
  }catch(e){
    statusEl.textContent='Ready - Version 131 TODAY 9/13';
  }
});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
